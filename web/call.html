<!doctype html>
<!--
  SAMJHA — THE BORROWER'S PAGE. Near-textless by design.

  She has low reading fluency. A UI that explains itself in written Hindi has failed, so
  this page has no file input, no text input, no navigation and no menu. One green circle.
  Everything it needs to say, it says ALOUD, in the same Rime voice (coda/taru/hi) that is
  about to read her loan.

  What it does show in writing is DIGITS. ₹1,04,596 at 44px is legible to someone who
  cannot read a sentence — a digit is not reading. Words are small and few; numbers are
  large.

  ── The three mobile traps this page exists to survive ─────────────────────────────
  1. AUTOPLAY. Mobile Safari grants a gesture ONCE, synchronously. If the tap handler
     awaits anything before starting audio, the gesture is spent and the borrower gets a
     connected, silent call that looks perfectly fine. So the handler unlocks the
     AudioContext and starts the prompt element FIRST, then does the async work.
  2. getUserMedia NEEDS A SECURE CONTEXT. On plain http from a phone the microphone is
     denied with no dialog and no error she could read: the agent talks, teach-back never
     happens, and it looks like a broken product. Checked up front and said out loud.
  3. TrackSubscribed. Connecting and enabling the mic is not enough — the agent's audio
     track has to be attached to an element, and `room.startAudio()` called if the browser
     still blocks playback. Miss this and the call is silent.

  Also handled: iOS suspending the microphone when the screen locks or the tab is
  backgrounded (the FSM correctly leaves the interrupted clause PARTIALLY_HEARD).

  Clause state is driven by the EXISTING /calls/{id}/live websocket and the existing
  clause_state payload — the same event stream the judge panel reads. No new server-side
  event shape.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b0d12">
<title>SAMJHA</title>
<link rel="stylesheet" href="/tokens.css">
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body {
    margin:0; background:var(--bg); color:var(--ink); overflow:hidden;
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column;
    /* Never let the one control sit under a phone's home indicator. */
    padding:env(safe-area-inset-top) env(safe-area-inset-right)
            env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  /* No webfont: a demo must not depend on fonts.googleapis.com being reachable. */
  .hi { font-family:"Noto Sans Devanagari","Nirmala UI","Kohinoor Devanagari",
        "Mangal",system-ui,sans-serif; }

  .screen { flex:1; display:none; flex-direction:column; align-items:center;
            justify-content:center; text-align:center; padding:22px; gap:18px; }
  .screen.on { display:flex; }

  .loan { display:flex; flex-direction:column; align-items:center; gap:6px; }
  .glyph { width:96px; height:96px; }
  /* Digits, not sentences. This is the part she can read. */
  .amount { font-size:44px; font-weight:800; letter-spacing:-.02em; line-height:1.05; }
  .kind { font-size:17px; color:var(--dim); }

  /* One control, ~40% of the screen, no text inside it. */
  .big {
    width:min(58vw,240px); aspect-ratio:1; border-radius:50%; border:none;
    background:var(--go); color:#04120a; cursor:pointer; display:grid;
    place-items:center; box-shadow:0 10px 40px rgba(29,185,84,.35);
    transition:transform .12s ease;
  }
  .big:active { transform:scale(.95); }
  .big.stop { background:var(--red); box-shadow:0 10px 40px rgba(255,92,92,.3); }
  .big.amber { background:var(--amber); box-shadow:0 10px 40px rgba(255,176,32,.3);
               color:#241700; }
  .big svg { width:44%; height:44%; }
  .pulse { animation:pulse 1.9s ease-out infinite; }
  @keyframes pulse {
    0% { box-shadow:0 0 0 0 rgba(29,185,84,.55); }
    100% { box-shadow:0 0 0 44px rgba(29,185,84,0); }
  }
  @media (prefers-reduced-motion:reduce) { .pulse { animation:none; } }

  .say { font-size:19px; max-width:22ch; }
  .small { font-size:14px; color:var(--dim); max-width:26ch; }

  /* In-call: the clause being read, as a ring of arcs rather than a list of words. */
  #incall { justify-content:space-between; }
  .arcs { display:flex; gap:7px; flex-wrap:wrap; justify-content:center; max-width:320px; }
  .arc { width:26px; height:8px; border-radius:6px; background:#2b3243;
         transition:background .35s ease; }
  .arc.active { background:var(--amber); }
  .arc.heard { background:#2f6f4a; }
  .arc.understood { background:var(--heard); }
  .arc.partial { background:var(--red); }

  .now { display:flex; flex-direction:column; gap:10px; align-items:center; }
  .now .title { font-size:22px; font-weight:700; }
  .value { font-size:40px; font-weight:800; letter-spacing:-.02em; }
  .value.pending { color:var(--dim); }
  .bar { width:min(78vw,320px); height:12px; background:#202634; border-radius:8px;
         overflow:hidden; }
  .bar > i { display:block; height:100%; width:0; background:var(--amber);
             transition:width .18s linear; }

  .listening .now .title { color:var(--amber); }
  .mic-ring { width:74px; height:74px; border-radius:50%; background:#202634;
              display:grid; place-items:center; }
  .mic-ring.live { background:var(--amber); }
  .mic-ring svg { width:36px; height:36px; }

  /* Her turn to speak. Amber, pulsing, and impossible to mistake for the reading state. */
  .turn { display:flex; flex-direction:column; align-items:center; gap:10px; }
  .turn-word { font-size:30px; font-weight:800; color:var(--amber);
               animation:breathe 1.6s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { opacity:1 } 50% { opacity:.45 } }
  .turn-ring { position:relative; width:92px; height:92px; }
  .turn-ring svg { width:92px; height:92px; transform:rotate(-90deg); }
  .turn-ring circle { fill:none; stroke-width:3.5; }
  .turn-ring .trk { stroke:#202634; }
  .turn-ring .run { stroke:var(--amber); stroke-linecap:round;
                    stroke-dasharray:100.5; transition:stroke-dashoffset .95s linear; }
  .turn-num { position:absolute; inset:0; display:grid; place-items:center;
              font-size:30px; font-weight:800; color:var(--amber);
              font-variant-numeric:tabular-nums; }
  .turn.ending .turn-word, .turn.ending .turn-num, .turn.ending .run { color:var(--red); }
  .turn.ending .run { stroke:var(--red); }

  /* While she is meant to be TALKING there is nothing playing to stop, and a large red
     button on screen reads as "press this to speak" — the first person to use this asked
     exactly that. Remove it from her turn entirely rather than explain it. */
  .listening .stack { display:none; }
  /* #incall is space-between for the reading state (arcs top, stop button bottom). With
     the stack gone that pushes the countdown onto the bottom edge, where a phone's home
     indicator clips it. Centre the remaining content for her turn. */
  #incall.listening { justify-content:center; gap:30px; }

  .expect { font-size:21px; font-weight:700; color:var(--ink); max-width:min(86vw,340px);
            background:#1a1f2b; border:1px solid var(--line); border-radius:10px;
            padding:10px 14px; line-height:1.4; }

  .convo { display:flex; flex-direction:column; gap:9px; max-width:min(86vw,360px);
           width:100%; border-top:1px solid var(--line); padding-top:12px; }
  /* The agent, left. Muted — it is being SPOKEN, the screen is only a receipt of it. */
  .said { align-self:flex-start; text-align:left; font-size:16px; line-height:1.4;
          color:var(--dim); border-left:3px solid var(--line); padding-left:10px; }
  .said.clause { color:var(--ink); border-left-color:var(--amber); }
  /* The question, kept separate from the clause so that asking does not erase the very
     sentence she is being asked to repeat. */
  .asked { align-self:flex-start; text-align:left; font-size:16px; line-height:1.4;
           color:var(--dim); padding-left:13px; }
  /* Her, right. */
  .heard { align-self:flex-end; text-align:right; max-width:100%;
           font-size:19px; line-height:1.45; color:var(--dim); }
  .heard.pass { color:var(--heard); }
  .heard.fail { color:var(--amber); }
  .heard:empty { display:none; }

  .stack { display:flex; flex-direction:column; align-items:center; gap:14px; }
  .ok  { color:var(--heard); }
  .bad { color:var(--amber); }
  [hidden] { display:none !important; }
.oplink{position:fixed; left:0; right:0; bottom:18px; text-align:center;
        font-size:12px; letter-spacing:.08em; color:var(--dim); text-decoration:none;
        font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.oplink:hover{color:var(--ink); text-decoration:underline}
</style>
</head>
<body>

<!-- 0 · READY. One tap. The tap is also the audio-unlock gesture. -->
<section class="screen on" id="ready">
  <div class="loan">
    <div id="glyph"></div>
    <div class="amount" id="amount">—</div>
    <div class="kind hi" id="kind"></div>
  </div>
  <button class="big pulse" id="btn-take" aria-label="Take the call">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.6 10.8c1.4 2.8 3.8 5.2 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.5.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.4 21 3 13.6 3 4.5 3 3.9 3.4 3.5 4 3.5h3.4c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.5.1.4 0 .8-.2 1l-2.2 2.3z"/></svg>
  </button>
  <div class="say hi" id="ready-say">सुनने के लिए हरा बटन दबाइए</div>
</section>

<!-- 1 · MICROPHONE -->
<section class="screen" id="mic">
  <div class="mic-ring live"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V22h2v-3.1A7 7 0 0 0 19 12h-2z"/></svg></div>
  <div class="say hi" id="mic-say">माइक चालू करने की अनुमति दीजिए</div>
  <button class="big amber" id="btn-mic" aria-label="Allow the microphone">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V22h2v-3.1A7 7 0 0 0 19 12h-2z"/></svg>
  </button>
  <!-- "Allow" in English on purpose: it is the literal word on the OS dialog. -->
  <div class="small">Allow</div>
</section>

<!-- 2 · IN CALL -->
<section class="screen" id="incall">
  <div class="arcs" id="arcs"></div>

  <div class="now">
    <div class="title hi" id="clause-title">…</div>
    <div class="value hi pending" id="clause-value"></div>
    <div class="bar"><i id="clause-bar"></i></div>
    <div class="small hi" id="clause-hint"></div>
  </div>

  <!-- HER TURN. Hidden until the agent is actually waiting. Devanagari word plus a ring
       that empties: she cannot read a clock, but she can see something running out. -->
  <div class="turn" id="turn" hidden>
    <div class="turn-word hi">बोलिए</div>
    <div class="turn-ring"><svg viewBox="0 0 36 36">
      <circle class="trk" cx="18" cy="18" r="16"/>
      <circle class="run" id="turn-arc" cx="18" cy="18" r="16"/>
    </svg><span class="turn-num" id="turn-num">30</span></div>
    <!-- The one fact she has to say back. Every clause carries exactly one now, so this is
         a phrase and not a list — the previous design bundled up to four charges into one
         clause and failed all four when she forgot the last. -->
    <div class="expect hi" id="expect" hidden></div>
  </div>

  <!-- The conversation, both sides. OUTSIDE #turn on purpose: endTurn() hides #turn, and
       these have to outlive her turn so the PASS/FAIL colour lands on words still on
       screen. Two speakers, told apart by side and colour rather than by a label she
       would have to read. -->
  <div class="convo" id="convo" hidden>
    <div class="said hi" id="said" hidden></div>
    <div class="asked hi" id="asked" hidden></div>
    <div class="heard hi" id="heard" hidden></div>
  </div>

  <div class="stack">
    <div class="mic-ring" id="mic-ring"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V22h2v-3.1A7 7 0 0 0 19 12h-2z"/></svg></div>
    <!-- Barge-in by TOUCH as well as by voice. The VAD already interrupts on speech; a
         borrower who does not know she may interrupt needs to see that she can. -->
    <button class="big stop" id="btn-stop" aria-label="Stop and ask again">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
    </button>
    <div class="small hi">रोकने के लिए दबाइए</div>
  </div>
</section>

<!-- 3 · OUTCOME -->
<section class="screen" id="done">
  <div id="done-glyph"></div>
  <div class="say hi" id="done-say"></div>
  <div class="small hi" id="done-detail"></div>
  <!-- Latin, small, and low on the screen ON PURPOSE. The borrower cannot read it and is
       not meant to: her outcome is the glyph and the Hindi line above. This is the
       operator's way out of the call and into the sealed record, and it is the only
       affordance on this page aimed at anyone but her. -->
  <a id="done-record" class="oplink" hidden>open the consent record &rarr;</a>
</section>

<!-- 4 · BLOCKED (insecure context: the microphone cannot work here) -->
<section class="screen" id="blocked">
  <div class="big amber" style="pointer-events:none">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 1 21h22L12 2zm1 14h-2v2h2v-2zm0-8h-2v6h2V8z"/></svg>
  </div>
  <div class="say hi" id="blocked-say">माइक काम नहीं करेगा</div>
  <div class="small" id="blocked-detail"></div>
</section>

<audio id="prompt" playsinline></audio>
<audio id="agent" autoplay playsinline></audio>

<script src="/vendor/livekit-client.umd.min.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const CALL_ID = decodeURIComponent(location.pathname.replace(/^\/c\//, ""));

const STATE_CLASS = {
  UNHEARD: "", PARTIALLY_HEARD: "partial", HEARD: "heard",
  TEACH_BACK_FAIL: "partial", UNDERSTOOD: "understood",
};

// What each clause is about, as a glyph. Keys are kfs/build_clauses.py's clause ids —
// all eleven of them, plus a fallback, because a missing icon is a blank screen.
const GLYPHS = {
  identity: "M4 7h16v10H4z M4 11h16", sanctioned: "M7 15h10M7 11h10M12 4v16",
  tenure: "M12 6v6l4 2 M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20z",
  emi: "M3 8h18v10H3z M3 12h18", interest_rate: "M5 19 19 5 M7 7h.01 M17 17h.01",
  rate_reset: "M4 12a8 8 0 1 1 3 6 M4 12H2m2 0V9",
  fees: "M12 2 2 7l10 5 10-5-10-5z M2 17l10 5 10-5", apr: "M5 19 19 5 M8 8h.01 M16 16h.01",
  total_repayment: "M4 6h16v12H4z M8 10h8M8 14h5",
  prepayment: "M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20z M12 7v5l3 3",
  grievance: "M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z",
  _: "M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20z",
};

function icon(id, size = 96, colour = "#f2f5fb") {
  return `<svg class="glyph" width="${size}" height="${size}" viewBox="0 0 24 24"
    fill="none" stroke="${colour}" stroke-width="1.6" stroke-linecap="round"
    aria-hidden="true"><path d="${GLYPHS[id] || GLYPHS._}"/></svg>`;
}

function show(id) {
  for (const s of document.querySelectorAll(".screen")) s.classList.toggle("on", s.id === id);
}

// ------------------------------------------------------------------ speaking

// Pre-rendered Rime prompts, with the browser's own voice as the fallback so a missing
// WAV degrades instead of leaving her in silence. See web/prompts.py.
const SPOKEN = {
  ready: "नमस्ते। आपके लोन की ज़रूरी जानकारी तैयार है। सुनने के लिए हरा बटन दबाइए।",
  mic: "अब माइक चालू करने की अनुमति दीजिए। Allow दबाइए।",
  mic_denied: "माइक के बिना हम आपकी बात रिकॉर्ड नहीं कर सकते। कृपया फिर से कोशिश कीजिए।",
  insecure: "यह पेज सुरक्षित नहीं है, इसलिए माइक काम नहीं करेगा। कृपया अपने प्रतिनिधि को बताइए।",
  connecting: "जोड़ रहे हैं। कृपया थोड़ा इंतज़ार कीजिए।",
  waiting_agent: "प्रतिनिधि जुड़ रहे हैं। लाइन पर बने रहिए।",
};

let audioUnlocked = false;

function unlockAudio() {
  // Called SYNCHRONOUSLY from the first tap. Mobile Safari grants the gesture once, and
  // an await before this point spends it — leaving a connected, silent call.
  if (audioUnlocked) return;
  audioUnlocked = true;
  for (const el of [$("#prompt"), $("#agent")]) {
    el.muted = true;
    el.play().catch(() => {});
    el.pause();
    el.muted = false;
    el.currentTime = 0;
  }
}

function hush() {
  // The agent is the only voice that matters once it starts. speechSynthesis QUEUES
  // rather than replaces, so without an explicit cancel every prompt stacks up behind
  // the last one and is still talking while Rime reads her loan — two voices at once,
  // and the borrower cannot tell which one is the disclosure.
  $("#prompt").pause();
  try { window.speechSynthesis?.cancel(); } catch { /* not everywhere */ }
}

let sayingKey = null;

function say(key) {
  const el = $("#prompt");
  // Two code paths legitimately ask for the same prompt in a row (the tap, then connect).
  // Restarting a clip she is already hearing sounds like a stutter, so ignore the repeat.
  if (sayingKey === key && !el.paused) return;
  sayingKey = key;
  el.onerror = null;
  hush();               // a new prompt REPLACES the previous one, never queues behind it
  // A 404 (prompts not synthesized) fires BOTH paths: play() rejects with
  // NotSupportedError and the element fires `error`. Without this guard the fallback
  // voice says every prompt twice.
  let spoke = false;
  const fallback = () => { if (spoke) return; spoke = true; speak(SPOKEN[key]); };
  el.src = `/prompts/${key}.wav`;
  el.onerror = fallback;
  const spoken = el.play();
  if (spoken && spoken.catch) spoken.catch(fallback);
}

function speak(text) {
  if (!text || !window.speechSynthesis) return;
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "hi-IN";
    speechSynthesis.speak(u);
  } catch { /* silence is the last resort, never a crash */ }
}

// ------------------------------------------------------------------ the loan

async function loadLoan() {
  try {
    const r = await fetch(`/calls/${encodeURIComponent(CALL_ID)}/kfs`);
    if (!r.ok) return null;
    const body = await r.json();
    const k = body.kfs;
    $("#glyph").innerHTML = icon("sanctioned");
    // Indian 2-2-3 grouping, which is how a KFS prints it and how she reads it.
    $("#amount").textContent = "₹" + inr(k.sanctioned_amount_inr);
    $("#kind").textContent = loanTypeHi(k.loan_type);
    return body;
  } catch { return null; }
}

function inr(v) {
  const n = String(v).split(".")[0].replace(/[^\d]/g, "");
  if (n.length <= 3) return n;
  const head = n.slice(0, -3), tail = n.slice(-3);
  return head.replace(/\B(?=(\d{2})+(?!\d))/g, ",") + "," + tail;
}

// Mirrors kfs/build_clauses.py's LOAN_TYPE_HI. An unmapped type shows in English inside
// a Hindi line, which is what a lender's own agent does on a real call.
const LOAN_TYPE_HI = {
  "Two-Wheeler Loan": "दोपहिया वाहन लोन", "Personal Loan": "व्यक्तिगत लोन",
  "Consumer Durable Loan": "घरेलू सामान लोन", "Gold Loan": "सोने पर लोन",
  "Small Business Loan": "छोटे व्यापार का लोन",
};
const loanTypeHi = (t) => LOAN_TYPE_HI[t] || t;

// ------------------------------------------------------------------ clause state

const clauses = new Map();   // clause_id -> {ordinal, title_hi, state, ...}

function renderArcs() {
  const ordered = [...clauses.values()].sort((a, b) => (a.ordinal ?? 0) - (b.ordinal ?? 0));
  $("#arcs").innerHTML = ordered.map((c) =>
    `<div class="arc ${c.active ? "active" : STATE_CLASS[c.state] || ""}"></div>`).join("");
}

function applyClause(ev) {
  const id = ev.clause_id;
  if (!id) return;
  agentArrived();   // the agent is registering clauses, so it is on the line
  const prev = clauses.get(id) || {};
  const c = { ...prev, ...ev };
  clauses.set(id, c);

  if (ev.active) {
    for (const [k, v] of clauses) if (k !== id) v.active = false;
    $("#clause-title").textContent = c.title_hi || "";
    $("#clause-hint").textContent = "";
    $("#incall").classList.remove("listening");
  }

  // The number currently being spoken, big. Grey until its segment has finished playing —
  // "heard" here means played out of the speaker, which is the whole product.
  const kvs = c.key_values || [];
  const pending = kvs.find((k) => !k.heard) || kvs[kvs.length - 1];
  const val = $("#clause-value");
  if (pending) {
    val.textContent = pending.raw_text || "";
    val.classList.toggle("pending", !pending.heard);
  } else {
    val.textContent = "";
  }

  const total = c.total_duration_s || 0;
  const heard = c.heard_through_s || 0;
  $("#clause-bar").style.width = total ? `${Math.min(100, (heard / total) * 100)}%` : "0%";

  if (c.state === "PARTIALLY_HEARD") {
    // Say it, do not write it: the clause will be re-read from the start.
    $("#clause-hint").textContent = "यह बात फिर से सुनाई जाएगी";
  } else if (c.state === "TEACH_BACK_FAIL") {
    $("#clause-hint").textContent = "कोई बात नहीं। फिर से सुनिए।";
  }

  renderArcs();
}

function onEvent(ev) {
  switch (ev.type) {
    case "clause_registered":
    case "clause_state":
      if (ev.type === "clause_state" && ev.active) { endTurn(); clearHeard(); }
      applyClause(ev);
      break;
    case "listening":
      startTurn(Number(ev.timeout_s) || 30, ev.expect);
      break;
    case "listening_done":
      endTurn();
      break;
    case "speaking":
      showSaid(ev.text, ev.kind, ev.clause_id);
      break;
    case "heard_you":
      showHeard(ev.transcript, null);
      break;
    case "teach_back":
      endTurn();
      // The transcript is already on screen from heard_you; just colour the verdict.
      showHeard(ev.transcript, !!ev.passed);
      $("#clause-hint").textContent = ev.passed
        ? "ठीक है" : "कोई बात नहीं। फिर से सुनिए।";
      break;
    case "consent":
      finish(ev);
      break;
    case "call_end":
      if ($("#done").classList.contains("on") === false) finish(null);
      break;
  }
}

// ------------------------------------------------------------------ her turn

let turnTimer = null;
const TURN_CIRC = 100.5;   // 2*pi*r for r=16, matching the svg above

function startTurn(seconds, expect) {
  endTurn();
  // Only her side. The question she is answering stays on screen while she answers it.
  $("#heard").hidden = true;
  $("#heard").textContent = "";
  const turn = $("#turn"), num = $("#turn-num"), arc = $("#turn-arc");
  turn.hidden = false;
  turn.classList.remove("ending");
  $("#incall").classList.add("listening");
  $("#mic-ring").classList.add("live");

  // Spoken form, not the digits — the digits are already up top in 40pt. This is the
  // shape of the sentence she has to produce.
  const ex = $("#expect");
  const want = (expect || []).map((k) => k.spoken_text || k.raw_text).filter(Boolean);
  ex.textContent = want.join(" · ");
  ex.hidden = want.length === 0;

  let left = Math.round(seconds);
  const paint = () => {
    num.textContent = left;
    arc.style.strokeDashoffset = String(TURN_CIRC * (1 - left / seconds));
    // Red for the last five seconds. She cannot read "hurry up"; she can see red.
    turn.classList.toggle("ending", left <= 5);
  };
  paint();
  turnTimer = setInterval(() => {
    left -= 1;
    if (left <= 0) { paint(); endTurn(); return; }
    paint();
  }, 1000);
}

function showConvo() { $("#convo").hidden = false; }

// The clause is read segment by segment, but she is asked to repeat the WHOLE clause —
// so the segments accumulate here instead of replacing one another, and the question goes
// in its own element. Replacing meant that by the time she had to repeat the sentence, the
// sentence was no longer on screen: she saw only the question.
let saidParts = [];
let saidClause = null;

function showSaid(text, kind, clauseId) {
  const t = (text || "").trim();
  if (!t) return;

  if (kind === "clause") {
    // Reset on the clause ITSELF changing, not on a clause_state event arriving. Keying
    // this off clause_state meant the previous clause's sentence was still on screen while
    // she was being asked about the next one — she would have repeated the wrong thing.
    if (clauseId && clauseId !== saidClause) {
      saidClause = clauseId;
      saidParts = [];
      $("#asked").hidden = true;
      $("#asked").textContent = "";
      $("#heard").hidden = true;
      $("#heard").textContent = "";
    }
    if (!saidParts.includes(t)) saidParts.push(t);   // a re-read must not double it up
    const el = $("#said");
    el.textContent = saidParts.join(" ");
    el.className = "said hi clause";
    el.hidden = false;
  } else {
    const el = $("#asked");
    el.textContent = t;
    el.hidden = false;
  }
  showConvo();
}

function showHeard(text, passed) {
  const el = $("#heard");
  const t = (text || "").trim();
  if (!t) {
    // She said nothing. Saying so is kinder, and more honest, than an empty box.
    el.textContent = passed === null ? "" : "कुछ सुनाई नहीं दिया";
    el.className = "heard hi fail";
    el.hidden = passed === null;
    if (!el.hidden) showConvo();
    return;
  }
  el.textContent = "«" + t + "»";
  el.className = "heard hi" + (passed === null ? "" : passed ? " pass" : " fail");
  el.hidden = false;
  showConvo();
}

function clearHeard() {
  saidParts = [];
  saidClause = null;
  for (const id of ["#heard", "#said", "#asked"]) {
    $(id).hidden = true;
    $(id).textContent = "";
  }
  $("#convo").hidden = true;
}

function endTurn() {
  if (turnTimer) { clearInterval(turnTimer); turnTimer = null; }
  $("#turn").hidden = true;
  $("#expect").hidden = true;
  $("#incall").classList.remove("listening");
  $("#mic-ring").classList.remove("live");
}

function finish(ev) {
  const granted = ev && ev.decision === "GRANTED";
  $("#done-glyph").innerHTML = granted
    ? icon("prepayment", 110, "#3ddc84")
    : icon("grievance", 110, "#ffb020");
  $("#done-say").textContent = granted
    ? "आपकी सहमति दर्ज हो गई है"
    : "अभी सहमति दर्ज नहीं हुई";
  // Amber, not red. If refusal looks like rejection, every borrower who sees one learns
  // that the honest path is the punished path.
  $("#done-say").className = "say hi " + (granted ? "ok" : "bad");
  endTurn();
  $("#done-detail").textContent = granted ? "" : "हमारा प्रतिनिधि आपको फिर कॉल करेगा";
  const rec = $("#done-record");
  rec.href = `/record/${encodeURIComponent(CALL_ID)}`;
  rec.hidden = false;
  show("done");
}

// ------------------------------------------------------------------ the call

let room = null;
let dispatched = false;

async function connect() {
  say("connecting");

  const r = await fetch(`/calls/${encodeURIComponent(CALL_ID)}/token`);
  if (!r.ok) {
    const body = await r.json().catch(() => ({}));
    $("#blocked-say").textContent = "कॉल जोड़ नहीं सके";
    $("#blocked-detail").textContent = body.detail || `HTTP ${r.status}`;
    show("blocked");
    return;
  }
  const { url, token } = await r.json();

  const LK = window.LivekitClient;
  room = new LK.Room({
    adaptiveStream: false,
    dynacast: false,
    // Without these the laptop mic hears the agent's own voice out of the laptop speakers,
    // the server-side VAD reads that as the borrower talking, and the agent interrupts
    // ITSELF — every clause chopped a second or two in. Browser defaults usually enable
    // AEC, but "usually" is not a thing to find out about on stage, so ask explicitly.
    audioCaptureDefaults: {
      echoCancellation: true,
      noiseSuppression: true,
      autoGainControl: true,
    },
  });

  // TRAP 3: without this the call is silent. Connecting and publishing the microphone is
  // not enough — the agent's track has to be attached to an element, and playback may
  // still be blocked until startAudio() is called from the user's gesture context.
  room.on(LK.RoomEvent.TrackSubscribed, (track) => {
    if (track.kind === LK.Track.Kind.Audio) {
      hush();   // the page stops talking the instant the agent starts
      track.attach($("#agent"));
      $("#agent").play().catch(() => {});
    }
  });
  room.on(LK.RoomEvent.AudioPlaybackStatusChanged, () => {
    if (!room.canPlaybackAudio) room.startAudio().catch(() => {});
  });
  room.on(LK.RoomEvent.ParticipantConnected, () => {
    $("#clause-hint").textContent = "";
  });
  room.on(LK.RoomEvent.Disconnected, () => { if (!clauses.size) say("waiting_agent"); });

  await room.connect(url, token);
  await room.localParticipant.setMicrophoneEnabled(true);
  if (!room.canPlaybackAudio) await room.startAudio().catch(() => {});

  // Explicit dispatch: the worker registers with an agent_name and takes dispatches only,
  // so it never joins rooms belonging to other apps sharing these credentials.
  // connect() runs from the green button, from the mic-retry button, and again on every
  // page reload. Each of those used to POST another dispatch, LiveKit created another one,
  // and a SECOND agent job joined and read the same ten clauses over the top of the first.
  // The server is idempotent now; this just avoids the pointless round trip.
  if (dispatched) return;
  dispatched = true;
  fetch(`/calls/${encodeURIComponent(CALL_ID)}/dispatch`, { method: "POST" })
    .then(async (res) => {
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        noAgent(body.detail || `dispatch failed (HTTP ${res.status})`);
      }
    })
    .catch((e) => noAgent(String(e)));

  show("incall");
  armAgentTimeout();
}

// LiveKit ACCEPTS a dispatch even when no worker is registered — the job is simply never
// claimed. So the happy path and "nobody is running `make agent`" look identical from
// here: connected, silent, forever. Time it out and say so, rather than leaving her on a
// screen that never changes.
const AGENT_TIMEOUT_MS = 15000;
let agentTimer = null;

function armAgentTimeout() {
  clearTimeout(agentTimer);
  agentTimer = setTimeout(() => {
    if (!clauses.size) noAgent("no agent joined this call");
  }, AGENT_TIMEOUT_MS);
}

function agentArrived() {
  clearTimeout(agentTimer);
  agentTimer = null;
}

function noAgent(detail) {
  if (clauses.size) return;   // it did arrive; nothing to report
  $("#incall").classList.remove("listening");
  $("#clause-title").textContent = "प्रतिनिधि नहीं जुड़े";
  $("#clause-value").textContent = "";
  $("#clause-hint").textContent = "कृपया अपने प्रतिनिधि को बताइए";
  say("waiting_agent");
  // For whoever is testing rather than borrowing. She cannot read it; they can.
  const note = document.createElement("div");
  note.className = "small";
  note.style.cssText = "color:#ffb020;max-width:30ch";
  note.textContent = `${detail} — is \`make agent\` running? It must print `
    + `"registered worker" before a call can start.`;
  $("#incall").appendChild(note);
}

function watch() {
  // The SAME event stream the judge panel reads. No borrower-specific server events.
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${proto}://${location.host}/calls/${encodeURIComponent(CALL_ID)}/live`);
  ws.onmessage = (m) => {
    const ev = JSON.parse(m.data);
    if (ev.type === "hello") return;
    onEvent(ev);
  };
  // Reconnect: a dropped socket must not freeze her screen mid-call.
  ws.onclose = () => setTimeout(watch, 1200);
}

// ------------------------------------------------------------------ boot

$("#btn-take").addEventListener("click", async () => {
  unlockAudio();          // SYNCHRONOUS, before any await. Trap 1.
  // "connecting", NOT "ready" — `ready` says "press the green button to listen", which is
  // 8.7s of instruction to do the thing she has just done, and it was still playing when
  // Rime began reading her loan. A prompt in the gesture is still required: mobile Safari
  // spends the tap on the first await, so the element must start a real play() here or
  // every later prompt is blocked.
  say("connecting");

  // Trap 2: on plain http from a phone getUserMedia is denied with no dialog at all.
  if (!window.isSecureContext) {
    $("#blocked-detail").textContent =
      `This page is on ${location.protocol}//. The microphone only works over HTTPS or on `
      + `localhost, so teach-back cannot happen. Serve it through a tunnel: `
      + `cloudflared tunnel --url http://localhost:8000`;
    show("blocked");
    say("insecure");
    return;
  }

  const granted = await navigator.mediaDevices?.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } })
    .then((s) => { s.getTracks().forEach((t) => t.stop()); return true; })
    .catch(() => false);

  if (!granted) { show("mic"); say("mic"); return; }
  await connect();
});

$("#btn-mic").addEventListener("click", async () => {
  const granted = await navigator.mediaDevices?.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } })
    .then((s) => { s.getTracks().forEach((t) => t.stop()); return true; })
    .catch(() => false);
  if (!granted) { say("mic_denied"); return; }
  await connect();
});

$("#btn-stop").addEventListener("click", () => {
  // Touch barge-in, alongside the VAD's voice barge-in. One value, no parameters: this is
  // a channel into the agent process, so it accepts exactly one thing and nothing else.
  try {
    room?.localParticipant.publishData(
      new TextEncoder().encode(JSON.stringify({ t: "barge_in" })), { reliable: true });
  } catch { /* the voice path still works */ }
  $("#agent").pause();
  $("#clause-hint").textContent = "रुक गया";
});

// iOS suspends the microphone when the screen locks or the tab is backgrounded. The FSM
// correctly leaves the interrupted clause PARTIALLY_HEARD, so it will be re-read; tell
// her that rather than letting the screen look frozen.
document.addEventListener("visibilitychange", () => {
  if (document.hidden || !room) return;
  room.startAudio().catch(() => {});
  room.localParticipant.setMicrophoneEnabled(true).catch(() => {});
});

loadLoan().then((body) => {
  if (!body) {
    $("#amount").textContent = "";
    $("#kind").textContent = "";
    $("#ready-say").textContent = "इस कॉल के लिए कोई दस्तावेज़ नहीं मिला";
  }
});
watch();
</script>
</body>
