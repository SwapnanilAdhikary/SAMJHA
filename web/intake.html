<!doctype html>
<!--
  SAMJHA — document intake. THE HELPER'S PAGE, and deliberately text-heavy.

  Choosing a PDF off a filesystem is a literacy-heavy act, so the borrower does not do it.
  This page is for whoever actually holds the document: a lender's field officer, a branch
  clerk, an NGO helper. That actor can read, so this page uses words, tables and a review
  step — the opposite of web/call.html, which is the borrower's and is near-textless.

  Three rules it enforces on the human, not just on the parser:

    1. NOTHING IS GUESSED. Every required Annex-A field the document did not yield shows as
       a red row with an input. The button stays disabled until each is filled. A field
       left to a pydantic default would be read aloud as a positive statement about the
       loan — see kfs/fields.py.
    2. THE DOCUMENT'S OWN WORDING IS SHOWN. A field matched by synonym is marked, quoting
       the label actually printed, so approving a drift match is a decision rather than an
       accident.
    3. SYNTHETIC vs REAL IS DECLARED, never inferred, and the choice is un-defaulted. It
       goes into the sha256-sealed consent record as an uploader assertion.

  It also previews the CLAUSES — what will actually be spoken, in Hindi — because a table
  of parsed values is not what the borrower experiences.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAMJHA — KFS intake</title>
<link rel="stylesheet" href="/tokens.css">
<style>
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  /* No webfont: a demo must not depend on fonts.googleapis.com being reachable. */
  .hi { font-family:"Noto Sans Devanagari","Nirmala UI","Kohinoor Devanagari",
        "Mangal",system-ui,sans-serif; }
  .mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
  header {
    padding:18px 22px; border-bottom:1px solid var(--line);
    display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
  }
  h1 { font-size:19px; margin:0; letter-spacing:.02em; }
  h2 { font-size:15px; margin:0 0 12px; text-transform:uppercase; letter-spacing:.08em;
       color:var(--dim); }
  main { max-width:1000px; margin:0 auto; padding:22px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px;
           padding:18px; margin-bottom:18px; }
  .note { color:var(--dim); font-size:13px; }
  .role { color:var(--dim); font-size:13px; }
  a { color:var(--drift); }

  /* Where you are. Cheap to render, and it answers "how much more of this is there". */
  .steps { display:flex; gap:8px; max-width:1000px; margin:0 auto; padding:16px 22px 0;
           font-size:13px; flex-wrap:wrap; }
  .step { display:flex; align-items:center; gap:7px; color:var(--dim);
          padding:6px 12px; border:1px solid var(--line); border-radius:20px; }
  .step b { display:grid; place-items:center; width:19px; height:19px; border-radius:50%;
            background:var(--line); color:var(--dim); font-size:11px; }
  .step.on { color:var(--ink); border-color:var(--accent); }
  .step.on b { background:var(--accent); color:#04120a; }
  .step.done b { background:var(--ok); color:#04120a; }

  /* The drop zone IS the page. One target, large, and it takes a drop. */
  .drop { display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center;
          padding:34px 20px; border:2px dashed var(--line); border-radius:12px;
          background:#0e1017; cursor:pointer; transition:border-color .15s, background .15s; }
  .drop:hover { border-color:var(--accent); }
  .drop.over { border-color:var(--accent); background:#12301f; }
  .drop.has  { border-style:solid; border-color:var(--ok); background:#12301f; }
  .drop svg { width:34px; height:34px; color:var(--dim); }
  .drop.has svg { color:var(--ok); }
  .drop-main { font-size:17px; font-weight:600; }

  .opts { margin-top:14px; border-top:1px solid var(--line); padding-top:12px; }
  .opts summary { cursor:pointer; color:var(--dim); font-size:13px; list-style:none; }
  .opts summary::-webkit-details-marker { display:none; }
  .opts summary::before { content:"▸ "; }
  .opts[open] summary::before { content:"▾ "; }
  .opts summary span { color:var(--ink); }

  /* Re-using a document already read is one click, not a table to parse. */
  .docs { display:flex; flex-wrap:wrap; gap:10px; }
  .doccard { text-align:left; padding:11px 13px; border:1px solid var(--line);
             border-radius:9px; background:#0e1017; cursor:pointer; font:inherit;
             color:var(--ink); min-width:210px; }
  .doccard:hover { border-color:var(--accent); }
  .doccard .fn { font-weight:600; font-size:14px; }
  .doccard .meta { color:var(--dim); font-size:11.5px; margin-top:3px; }
  .doccard .real { color:var(--bad); font-weight:700; }

  label.block { display:block; margin:12px 0 6px; font-weight:600; font-size:13px; }
  input[type=text], input[type=file], select {
    background:#0e1017; color:var(--ink); border:1px solid var(--line);
    border-radius:6px; padding:9px 10px; font-size:14px; width:100%;
  }
  input[type=text]:focus, select:focus { outline:2px solid var(--accent); }
  .radios { display:flex; gap:10px; flex-wrap:wrap; margin-top:6px; }
  .radios label {
    display:flex; align-items:center; gap:8px; padding:10px 12px; cursor:pointer;
    border:1px solid var(--line); border-radius:8px; background:#0e1017; font-size:14px;
  }
  .radios label:has(input:checked) { border-color:var(--accent); background:#1b1830; }
  .radios label.disabled { opacity:.45; cursor:not-allowed; }

  button {
    font:600 15px/1 inherit; padding:12px 18px; border-radius:8px; cursor:pointer;
    border:1px solid var(--line); background:#232838; color:var(--ink);
  }
  button.primary { background:var(--accent); border-color:var(--accent); color:#0d0a1f; }
  button:disabled { opacity:.4; cursor:not-allowed; }

  table { width:100%; border-collapse:collapse; font-size:13.5px; }
  th, td { text-align:left; padding:7px 9px; border-bottom:1px solid var(--line);
           vertical-align:top; }
  th { color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:.07em; }
  tr.missing { background:rgba(255,92,92,.09); }
  tr.drifted { background:rgba(84,160,255,.08); }

  .chip { display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px;
          font-weight:700; letter-spacing:.04em; text-transform:uppercase; }
  .chip.parsed  { background:#20303f; color:var(--dim); }
  .chip.drifted { background:#16324f; color:var(--drift); }
  .chip.missing { background:#43181d; color:var(--bad); }
  .chip.human   { background:#3a2c12; color:var(--warn); }

  .banner { padding:12px 14px; border-radius:8px; margin-bottom:14px; font-size:14px; }
  .banner.bad  { background:#3a1417; border:1px solid #5d2429; }
  .banner.ok   { background:#12301f; border:1px solid #1f5636; }
  .banner.warn { background:#3a2c12; border:1px solid #5d4718; }

  .clause { border-left:3px solid var(--line); padding:8px 0 8px 12px; margin-bottom:12px; }
  .clause .title { font-weight:700; margin-bottom:3px; }
  .clause .text { color:#cbd3e6; font-size:14px; }
  .kv { font-size:12px; color:var(--dim); margin-top:5px; }
  .kv b { color:var(--ok); font-weight:700; }
  code { background:#0e1017; padding:1px 5px; border-radius:4px; font-size:12.5px; }
  .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .grow { flex:1 1 240px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>

<header>
  <h1>SAMJHA</h1>
  <span class="role">Key Facts Statement &rarr; a consent call she can hear</span>
  <span style="flex:1"></span>
  <a href="/panel" class="mono" style="font-size:13px">evidence panel &rarr;</a>
</header>

<!-- Where you are. Three steps, and the page only ever asks for one of them at a time. -->
<nav class="steps" id="steps" aria-label="progress">
  <span class="step on" data-step="1"><b>1</b> Document</span>
  <span class="step" data-step="2"><b>2</b> Review</span>
  <span class="step" data-step="3"><b>3</b> Call</span>
</nav>

<main>

<div class="panel" id="panel-upload">
  <!-- One affordance, large, and it accepts a drop. The bare file input it replaces gave
       no hint that this was the whole job of the page. -->
  <label class="drop" id="drop" for="file">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm0 7V3.5L19.5 9H14z"/>
    </svg>
    <div class="drop-main" id="drop-main">Drop a KFS here, or click to choose</div>
    <div class="note">PDF or Word (.docx) &middot; read from the table grid, never from a picture</div>
  </label>
  <input type="file" id="file" hidden
         accept=".pdf,.docx,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document">

  <div class="row" style="margin-top:16px; align-items:center; gap:12px">
    <button class="primary" id="btn-upload" disabled>Read the document</button>
    <span class="note" id="upload-status"></span>
  </div>

  <!-- Both of these are right almost every time. Folded away so the page asks one
       question, not three — but the current answer stays visible in the summary. -->
  <details class="opts" id="opts">
    <summary>Provenance &mdash; <span id="opts-summary"></span></summary>

    <label class="block">Who is uploading this?</label>
    <div class="radios" id="roles">
      <label><input type="radio" name="role" value="lender_system" checked> Lender / origination system</label>
      <label><input type="radio" name="role" value="branch_helper"> Branch clerk or helper</label>
      <label><input type="radio" name="role" value="borrower"> The borrower herself</label>
    </div>
    <p class="note">Recorded in the consent record, so an auditor can see whether one
      person filled every role.</p>

    <label class="block">Is this a real borrower's document?</label>
    <div class="radios" id="synthetic">
      <label><input type="radio" name="synth" value="true" checked> Specimen / synthetic</label>
      <label id="real-label"><input type="radio" name="synth" value="false"> Real borrower data</label>
    </div>
    <p class="note" id="real-note"></p>
  </details>
</div>

<div id="result" hidden></div>

<div class="panel" id="panel-recent">
  <h2>Or re-use a document already read</h2>
  <div id="recent"><p class="note">None yet.</p></div>
</div>

</main>

<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

let doc = null;   // the document view returned by the API

// ---------------------------------------------------------------- real-data gate

async function checkRealDataAllowed() {
  // The server refuses non-synthetic uploads unless SAMJHA_ALLOW_REAL_DATA is set. Show
  // that as a disabled option with its reason, rather than letting someone pick it and
  // meet a 403 after choosing a file.
  let allowed = false;
  try {
    const r = await fetch("/health");
    allowed = !!(await r.json()).allow_real_data;
  } catch { /* leave it disabled */ }

  const input = $("#real-label input");
  input.disabled = !allowed;
  $("#real-label").classList.toggle("disabled", !allowed);
  $("#real-note").textContent = allowed
    ? "This server is configured to accept real borrower data. README.md's “no real borrower data, ever” no longer describes this deployment."
    : "Real borrower data is refused by this server. Set SAMJHA_ALLOW_REAL_DATA=1 to allow it.";
}

// -------------------------------------------------------------------- uploading

function setStep(n) {
  for (const el of document.querySelectorAll(".step")) {
    const i = Number(el.dataset.step);
    el.classList.toggle("on", i === n);
    el.classList.toggle("done", i < n);
  }
}

function showPicked() {
  const f = $("#file").files[0];
  $("#btn-upload").disabled = !f;
  $("#upload-status").textContent = "";
  $("#drop").classList.toggle("has", !!f);
  $("#drop-main").textContent = f
    ? `${f.name} — ${(f.size / 1024).toFixed(0)} KB`
    : "Drop a KFS here, or click to choose";
}

$("#file").addEventListener("change", showPicked);

// Drag and drop onto the same target the click opens.
const drop = $("#drop");
for (const ev of ["dragenter", "dragover"]) {
  drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); });
}
for (const ev of ["dragleave", "drop"]) {
  drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("over"); });
}
drop.addEventListener("drop", (e) => {
  const f = e.dataTransfer?.files?.[0];
  if (!f) return;
  const dt = new DataTransfer();
  dt.items.add(f);
  $("#file").files = dt.files;   // keeps ONE source of truth for the upload handler
  showPicked();
});

// Keep the folded summary honest about what is actually selected.
function syncOpts() {
  const role = $("input[name=role]:checked").parentElement.textContent.trim();
  const synth = $("input[name=synth]:checked").value === "true";
  $("#opts-summary").innerHTML =
    `${esc(role)} · ${synth ? "specimen" : "<b class='real'>REAL borrower data</b>"}`;
}
for (const el of document.querySelectorAll("#roles input, #synthetic input")) {
  el.addEventListener("change", syncOpts);
}

$("#btn-upload").addEventListener("click", async () => {
  const file = $("#file").files[0];
  if (!file) return;

  const role = $("input[name=role]:checked").value;
  const synthetic = $("input[name=synth]:checked").value;
  const q = new URLSearchParams({ filename: file.name, role, synthetic });

  $("#btn-upload").disabled = true;
  $("#upload-status").textContent = `reading ${file.name}…`;
  try {
    // The file IS the request body. Not multipart: python-multipart is not installed,
    // and this is less code on both sides.
    const r = await fetch(`/kfs?${q}`, { method: "POST", body: file });
    const body = await r.json();
    if (!r.ok) {
      $("#upload-status").textContent = "";
      render(null, body.detail || `HTTP ${r.status}`);
      return;
    }
    $("#upload-status").textContent = "";
    doc = body;
    render(doc);
    setStep((body.missing || []).length ? 2 : 3);
    loadRecent();
  } catch (e) {
    render(null, String(e));
  } finally {
    $("#btn-upload").disabled = !$("#file").files.length;
  }
});

// -------------------------------------------------------------------- rendering

function fieldRow(f) {
  const corrected = (doc.corrections || []).find((c) => c.label === f.label);
  const status = corrected ? "human" : f.status;
  const chip = { parsed: "parsed", drifted: "matched by synonym", missing: "NOT READ",
                 human: "supplied by hand" }[status] || status;

  let value;
  if (f.status === "missing" && !corrected) {
    value = `<input type="text" data-label="${esc(f.label)}" class="fix"
                    placeholder="${esc(f.prompt || f.label)}">`;
  } else {
    value = `<span class="mono">${esc(corrected ? corrected.value : f.value)}</span>`;
  }

  // The document's OWN wording, quoted, whenever it differs from Annex A's.
  const drift = f.status === "drifted" && f.document_label
    ? `<div class="note">printed as <code>${esc(f.document_label)}</code></div>` : "";
  const derived = f.derived
    ? `<div class="note">read as prose, not as a number</div>` : "";

  return `<tr class="${f.status === "missing" && !corrected ? "missing" : f.status === "drifted" ? "drifted" : ""}">
    <td>${esc(f.label)}${drift}${derived}</td>
    <td>${value}</td>
    <td><span class="chip ${status}">${esc(chip)}</span></td>
  </tr>`;
}

function render(d, error) {
  const out = $("#result");
  out.hidden = false;

  if (error) {
    out.innerHTML = `<div class="panel"><div class="banner bad">
      <b>Could not read this document.</b><div style="margin-top:6px">${esc(error)}</div></div>
      <p class="note">A KFS must be a PDF or .docx whose Part 1 is a real table. A scan, a
      photograph, or a document laid out with tab stops has no table grid to read.</p>
    </div>`;
    return;
  }

  const missing = d.missing || [];
  const ready = missing.length === 0 && d.status === "confirmed";

  const banner = ready
    ? `<div class="banner ok"><b>Every required field was read.</b>
        ${d.clauses.length} clauses will be spoken.</div>`
    : `<div class="banner bad"><b>${missing.length} required field(s) were not read.</b>
        Fill them in below. Nothing is guessed: a field left blank would otherwise be
        spoken as a statement about this loan — for example a missing cooling-off period
        becomes “<span class="hi">इस लोन में कूलिंग-ऑफ की अवधि नहीं है।</span>”, denying a
        statutory right the document may well grant.</div>`;

  const validation = d.validation_error
    ? `<div class="banner warn"><b>Read, but did not validate:</b>
        <span class="mono">${esc(d.validation_error)}</span></div>` : "";

  const unknown = Object.keys(d.unknown_labels || {}).length
    ? `<div class="panel"><h2>Labels we did not recognise</h2>
        <p class="note">Left alone rather than guessed at. If one of these is really an
        Annex-A field, add it to <code>kfs/fields.py</code>'s synonym table.</p>
        <table><tbody>${Object.entries(d.unknown_labels).map(([k, v]) =>
          `<tr><td>${esc(k)}</td><td class="mono">${esc(v)}</td></tr>`).join("")}</tbody></table></div>`
    : "";

  const fees = d.fee_table_found
    ? `<p class="note">${d.fee_rows.length} fee row(s) read from the sub-table.</p>`
    : `<div class="banner warn">No fee sub-table was found. An empty fee table is a real
        answer (“this loan has no fees”); a table that was never found is not. Check the
        document before continuing.</div>`;

  out.innerHTML = `
  <div class="panel">
    <h2>2 · What the document says</h2>
    ${banner}${validation}
    <p class="note">
      <span class="mono">${esc(d.filename || d.doc_id)}</span> ·
      ${esc(d.method)} · ${d.byte_size} bytes ·
      sha256 <span class="mono">${esc((d.sha256 || "").slice(0, 16))}…</span> ·
      ${d.synthetic ? "synthetic" : "<b>REAL BORROWER DATA</b>"}
    </p>
    <table>
      <thead><tr><th>Annex-A field</th><th>Value</th><th>Source</th></tr></thead>
      <tbody>${(d.fields || []).map(fieldRow).join("")}</tbody>
    </table>
    ${fees}
    <div class="row" style="margin-top:14px">
      <button id="btn-fix" ${missing.length ? "" : "hidden"}>Save these values</button>
      <button class="primary" id="btn-call" ${ready ? "" : "disabled"}>Create the call</button>
      <span class="note" id="call-status"></span>
    </div>
    <!-- The result lands here, immediately below the button that produced it. -->
    <div id="call-ready"></div>
  </div>
  ${unknown}
  ${d.clauses.length ? `
  <div class="panel">
    <h2>3 · What she will actually hear</h2>
    <p class="note">Generated by the delivery layer — one comprehension-critical value per
      spoken segment. This is the text, in Hindi, that Rime will read.</p>
    ${d.clauses.map((c) => `
      <div class="clause">
        <div class="title hi">${esc(c.title_hi)} <span class="note mono">${esc(c.clause_id)}</span></div>
        <div class="text hi">${esc(c.text)}</div>
        ${c.key_values.length ? `<div class="kv">${c.key_values.map((kv) =>
          `${esc(kv.kind)}: <b>${esc(kv.raw_text)}</b> → <span class="hi">${esc(kv.spoken_text)}</span>`
        ).join(" · ")}</div>` : ""}
      </div>`).join("")}
  </div>` : ""}
  `;

  const fix = $("#btn-fix");
  if (fix) fix.addEventListener("click", saveCorrections);
  $("#btn-call").addEventListener("click", createCall);

  // A re-render (after supplying a missing field) must not offer to create a second call
  // for a document that already has one.
  if (createdCall && createdCall.docId === d.doc_id) {
    $("#btn-call").textContent = "Call created";
    $("#btn-call").disabled = true;
    showCallReady(createdCall.callId);
  }
}

async function saveCorrections() {
  const values = {};
  for (const el of document.querySelectorAll("input.fix")) {
    if (el.value.trim()) values[el.dataset.label] = el.value.trim();
  }
  if (!Object.keys(values).length) return;

  const r = await fetch(`/kfs/${encodeURIComponent(doc.doc_id)}`, {
    method: "PATCH",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ values, by: "intake page" }),
  });
  const body = await r.json();
  if (!r.ok) { render(null, body.detail || `HTTP ${r.status}`); return; }
  doc = body;
  render(doc);
}

// One call per document, and one in flight at a time. Without these guards every click
// created another call row: the button stayed live during the request AND after it
// succeeded, and the result panel was inserted at the TOP of the page while the button is
// at the bottom — so nothing visibly happened and the natural response was to click
// again. Ten orphan calls, none of them started.
let creating = false;
// Keyed by doc_id, because render() re-runs after a correction and would otherwise
// re-enable the button for a document that already has a call.
let createdCall = null;   // {docId, callId}

async function createCall() {
  if (creating) return;
  if (createdCall && createdCall.docId === doc.doc_id) {
    showCallReady(createdCall.callId);
    return;
  }

  creating = true;
  const btn = $("#btn-call");
  btn.disabled = true;
  $("#call-status").textContent = "creating…";
  try {
    const r = await fetch("/calls", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ doc_id: doc.doc_id }),
    });
    const body = await r.json();
    if (!r.ok) {
      $("#call-status").textContent = body.detail || `HTTP ${r.status}`;
      btn.disabled = false;
      return;
    }
    createdCall = { docId: doc.doc_id, callId: body.id };
    $("#call-status").textContent = "";
    btn.textContent = "Call created";
    showCallReady(body.id);
  } catch (e) {
    $("#call-status").textContent = String(e);
    btn.disabled = false;
  } finally {
    creating = false;
  }
}

function showCallReady(callId) {
  const link = `${location.origin}/c/${callId}`;
  // Rendered into a container that sits directly BELOW the button, and scrolled to, so
  // the result appears where the person who clicked is actually looking.
  $("#call-ready").innerHTML = `
    <div class="banner ok" style="margin-top:14px">
      <b>Call created.</b> It does not start by itself — open the link below.
    </div>
    <p class="row" style="margin-top:10px">
      <input type="text" class="mono grow" readonly value="${esc(link)}"
             onclick="this.select()">
      <button onclick="navigator.clipboard&&navigator.clipboard.writeText('${esc(link)}')">Copy</button>
    </p>
    <p class="row">
      <a href="${esc(link)}" target="_blank"><button class="primary">Open the borrower page →</button></a>
      <a href="/?call=${esc(callId)}" target="_blank"><button>Watch the clause panel</button></a>
      <a href="/record/${esc(callId)}" target="_blank"><button>Record</button></a>
    </p>
    <div id="agent-warning"></div>
    <p class="note">
      On a phone this must be served over <b>HTTPS</b>
      (<code>cloudflared tunnel --url http://localhost:8000</code>). On plain http the
      microphone is denied silently and teach-back never happens. On this machine
      <code>localhost</code> already counts as secure.
    </p>
    <p class="note">Anyone with this link can join the call and read this KFS. There is no
      authentication — fine for a demo, not for a deployment.</p>`;

  $("#call-ready").scrollIntoView({ behavior: "smooth", block: "center" });
  warnIfAgentMissing();
}

async function warnIfAgentMissing() {
  // The commonest reason a call "does not start": `make serve` is running and
  // `make agent` is not. Dispatch is explicit, so LiveKit accepts the dispatch and no
  // worker ever claims it — the borrower waits on a screen that never changes. Say so
  // here, before anyone walks over to a phone.
  let health = {};
  try {
    health = await (await fetch("/health")).json();
  } catch { return; }

  const el = $("#agent-warning");
  if (!el) return;
  if (!health.livekit_configured) {
    el.innerHTML = `<div class="banner bad" style="margin-top:10px">
      <b>LiveKit is not configured.</b> Set LIVEKIT_URL, LIVEKIT_API_KEY and
      LIVEKIT_API_SECRET in <code>.env</code> and restart <code>make serve</code>.
      The borrower page cannot join a room without them.</div>`;
    return;
  }
  el.innerHTML = `<div class="banner warn" style="margin-top:10px">
    <b>Is <code>make agent</code> running?</b> The worker registers as
    <code>${esc(health.agent_name || "")}</code> and takes explicit dispatches only, so
    without it the borrower joins the room and nobody reads to her. Its terminal should
    say <code>registered worker</code>.</div>`;
}

async function loadRecent() {
  try {
    const rows = await (await fetch("/kfs")).json();
    // De-duplicated by sha256: uploading the same specimen five times while rehearsing
    // produced five identical rows, which buried the one you actually wanted.
    const seen = new Set();
    const uniq = rows.filter((d) => !seen.has(d.sha256) && seen.add(d.sha256)).slice(0, 8);

    $("#recent").innerHTML = uniq.length ? `<div class="docs">${uniq.map((d) => `
      <button class="doccard" data-doc="${esc(d.doc_id)}">
        <div class="fn">${esc(d.filename || d.doc_id)}</div>
        <div class="meta">${esc(d.method)} · ${esc(d.uploaded_by_role)} ·
          ${d.synthetic ? "specimen" : "<span class='real'>REAL</span>"}</div>
        <div class="meta mono">${esc(d.sha256.slice(0, 12))}…</div>
      </button>`).join("")}</div>` : `<p class="note">None yet.</p>`;

    for (const btn of document.querySelectorAll("#recent .doccard")) {
      btn.addEventListener("click", async () => {
        const r = await fetch(`/kfs/${encodeURIComponent(btn.dataset.doc)}`);
        if (!r.ok) return;
        doc = await r.json();
        render(doc);
        setStep((doc.missing || []).length ? 2 : 3);
        window.scrollTo(0, 0);
      });
    }
  } catch { /* the list is a convenience, not the job */ }
}

checkRealDataAllowed();
syncOpts();
loadRecent();
</script>
</body>
</html>
